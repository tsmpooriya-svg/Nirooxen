version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:30"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      next-runtime:
        patterns:
          - "next"
          - "eslint-config-next"
          - "sharp"
