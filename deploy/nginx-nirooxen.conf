# =============================================================================
#  پیکربندی nginx برای نیروکسن
# =============================================================================
#  nginx دو کار می‌کند: پروکسی به Node روی ۳۰۰۰، و تحویل مستقیم فایل‌های مدیا
#  از دیسک تا بار تصاویر روی Node نیفتد.
#
#  نصب:
#      sudo cp deploy/nginx-nirooxen.conf /etc/nginx/sites-available/nirooxen
#      sudo ln -s /etc/nginx/sites-available/nirooxen /etc/nginx/sites-enabled/
#      sudo rm -f /etc/nginx/sites-enabled/default
#      sudo nginx -t && sudo systemctl reload nginx
#
#  گواهی TLS با certbot اضافه می‌شود؛ خودش این فایل را ویرایش می‌کند:
#      sudo certbot --nginx -d example.com -d www.example.com
# =============================================================================

# محدودسازی نرخ در لایهٔ nginx، پیش از آنکه درخواست به Node برسد.
# برنامه محدودسازی خودش را هم دارد؛ این لایهٔ بیرونی است نه جایگزین.
limit_req_zone $binary_remote_addr zone=nirooxen_app:10m rate=30r/s;

server {
    listen 80;
    # اگر سرورتان IPv6 دارد این خط را از حالت توضیح دربیاورید. روی سروری که
    # IPv6 ندارد، nginx با «Address family not supported» اصلاً بالا نمی‌آید.
    # listen [::]:80;
    server_name example.com www.example.com;   # ← دامنهٔ خودتان

    # certbot این بلاک را با ریدایرکت به ۴۴۳ جایگزین می‌کند
    client_max_body_size 12M;   # سقف آپلود تصویر در پنل

    # فشرده‌سازی متن؛ webp و jpeg از قبل فشرده‌اند و دوباره فشرده نمی‌شوند
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml font/woff2;

    # ── تصاویر آپلودشده ──────────────────────────────────────────────────────
    #
    # ⚠️ اینجا عمداً کل پوشهٔ مدیا alias نشده است.
    #
    # هر دارایی دو فایل دارد: detail.webp که نسخهٔ تحویلیِ عمومی است، و
    # original.<ext> که بایت‌به‌بایت همان فایل آپلودی است و متادیتای EXIF —
    # از جمله مختصات GPS — را نگه می‌دارد. نشانی نسخهٔ تحویلی در HTML عمومی
    # هست و پسوند نسخهٔ مادر فقط سه حالت دارد، پس alias کردن کل پوشه یعنی
    # نسخهٔ مادر با دو درخواست ناموفق پیدا می‌شود.
    #
    # همان فهرست سفیدی که src/app/media/[...key]/route.ts دارد، اینجا هم
    # بازتولید می‌شود: فقط این دو نام، نه بر اساس پسوند.
    location ~ ^/media/(.+/)?(detail|card)\.webp$ {
        alias /var/lib/nirooxen/media/$1$2.webp;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # هر چیز دیگری زیر /media — از جمله original.* — بدون رسیدن به دیسک رد می‌شود.
    # پاسخ همان ۴۰۴ فایل ناموجود است، پس از بیرون نمی‌توان فهمید نسخهٔ مادر هست یا نه.
    location /media/ {
        return 404;
    }

    # ── دارایی‌های ساخته‌شدهٔ Next ────────────────────────────────────────────
    # نام فایل‌ها هش دارند، پس تا ابد قابل کش‌اند
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── برنامه ───────────────────────────────────────────────────────────────
    location / {
        limit_req zone=nirooxen_app burst=60 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # هدرها بازنویسی می‌شوند، نه عبور داده — وگرنه مهاجم با یک هدر ساختگی
        # سطل محدودسازی تازه می‌گیرد. برنامه X-Real-IP را ترجیح می‌دهد.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
