    <pattern id="hz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="14" height="28" fill="#e02a1e" fill-opacity=".85"/>
      <rect x="14" width="14" height="28" fill="#ffffff"/>
    </pattern>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <rect width="480" height="360" fill="url(#grid)"/>
  <rect width="480" height="360" fill="url(#glow)"/>
  <rect y="0" width="480" height="8" fill="url(#hz)"/>
  <rect y="352" width="480" height="8" fill="url(#hz)"/>
  <g fill="none" stroke="#c01a10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".62">
    <rect x="148" y="90" width="184" height="180" rx="8"/>
    <path d="M240 90v180" stroke-opacity=".4"/>
    <rect x="168" y="112" width="52" height="52" rx="4" stroke-opacity=".35"/>
    <circle cx="228" cy="180" r="7" stroke-opacity=".45"/>
    <circle cx="252" cy="180" r="7" stroke-opacity=".45"/>
    <circle cx="286" cy="184" r="34" stroke-opacity=".4"/>
    <circle cx="286" cy="184" r="14" stroke-opacity=".3"/>
    <path d="M148 270h184" stroke-opacity=".3"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"
